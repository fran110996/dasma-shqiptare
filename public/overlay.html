<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahengu Shqiptare — Overlay</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e41e20;
    --red-deep: #8d0b12;
    --gold: #f6c544;
    --gold-deep: #c8901a;
    --cream: #fff4dc;
    --ink: #2a0a0c;
    --panel: rgba(28, 4, 6, 0.9);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'Baloo 2', system-ui, sans-serif; color: var(--cream); }

  #stage {
    position: fixed; left: 0; top: 0; width: 1080px; height: 1920px;
    transform-origin: 0 0; overflow: hidden; background: #1a0306;
  }
  canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #fx { z-index: 20; pointer-events: none; }
  .ui { position: absolute; z-index: 10; }

  /* ---------- Title ---------- */
  #title {
    /* centered without translate(-50%): half-pixel offsets made nearby text shimmer when scaled */
    left: 0; right: 0; margin: 0 auto; width: fit-content; top: 168px;
    padding: 6px 64px 14px; border-radius: 26px;
    background: linear-gradient(180deg, #ff4146 0%, #e41e20 45%, #a50d13 100%);
    border: 5px solid var(--gold);
    box-shadow: 0 0 0 4px #5a0508, 0 14px 30px rgba(0,0,0,.55), inset 0 4px 0 rgba(255,255,255,.35), 0 0 60px rgba(255,60,40,.45);
    font-family: 'Lilita One', sans-serif; font-size: 80px; letter-spacing: 3px; white-space: nowrap;
    color: #fff; text-shadow: 0 5px 0 #6d0309, 0 8px 14px rgba(0,0,0,.5);
  }
  /* pulsing glow on its own layer: only opacity animates, so nothing around it gets repainted */
  #title .glow {
    position: absolute; inset: -5px; border-radius: 26px; z-index: -1; pointer-events: none;
    box-shadow: 0 0 80px rgba(255,190,60,.65); opacity: .3; will-change: opacity;
    animation: titleGlow 3s ease-in-out infinite;
  }
  #title::before, #title::after {
    content: '✦'; position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--gold); font-size: 40px; text-shadow: 0 0 12px rgba(255,210,80,.9);
  }
  #title::before { left: 18px; } #title::after { right: 18px; }
  @keyframes titleGlow {
    0%,100% { opacity: .3; }
    50% { opacity: 1; }
  }

  /* ---------- Ticker ---------- */
  #ticker {
    left: 0; right: 0; margin: 0 auto; width: fit-content; top: 292px;
    height: 60px; min-width: 520px; max-width: 980px; padding: 0 30px 0 8px;
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, #fffaf0, #f4e3bf);
    border: 4px solid var(--gold); border-radius: 40px;
    box-shadow: 0 8px 20px rgba(0,0,0,.45);
    color: var(--ink); font-weight: 800; font-size: 30px; white-space: nowrap;
  }
  #ticker .av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 3px solid var(--red); background: #ddd; flex: none; }
  #ticker .av.emoji { display: grid; place-items: center; font-size: 30px; background: transparent; border: none; }
  #ticker .name { color: var(--red); }
  #ticker .txt { overflow: hidden; text-overflow: ellipsis; }
  /* soft fade + small rise (no scaling: scaled text looks shaky at small sizes) */
  #ticker .txt, #ticker .av { transition: none; }
  #ticker.swap .txt, #ticker.swap .av { animation: tickerIn .4s ease-out; }
  @keyframes tickerIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Gift legend ---------- */
  /* a few big cards at a time (pages rotate) so they stay readable on a phone */
  #legend { left: 16px; top: 366px; width: 1048px; height: 118px; display: flex; gap: 10px; transition: opacity .35s; }
  #legend.fade { opacity: 0; }
  .gcard {
    flex: 1; min-width: 0; height: 118px; border-radius: 20px; padding: 8px 14px 8px 10px;
    background: linear-gradient(180deg, rgba(70,8,12,.92), rgba(25,3,5,.92));
    border: 3px solid var(--gold-deep);
    box-shadow: inset 0 0 0 2px rgba(255,220,120,.18), 0 6px 14px rgba(0,0,0,.5);
    display: flex; flex-direction: row; align-items: center; gap: 12px;
    position: relative; overflow: hidden;
  }
  .gcard .gi { width: 84px; height: 84px; flex: none; display: grid; place-items: center; font-size: 66px; line-height: 1;
    border-radius: 16px; background: radial-gradient(circle, rgba(255,210,120,.22), transparent 70%); }
  .gcard .gi img { width: 84px; height: 84px; object-fit: contain; }
  .gcard .gt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .gcard .gn { font-size: 22px; font-weight: 700; color: #f1d9b5; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gcard .gn b { color: #fff; }
  .gcard .gl { font-size: 30px; font-weight: 800; color: var(--gold); line-height: 1; text-shadow: 0 2px 0 #000; }
  .gcard.hit { animation: cardHit .7s ease-out; }
  .gcard.hit::after {
    content: ''; position: absolute; inset: 0; border-radius: 16px;
    background: radial-gradient(circle, rgba(255,220,100,.7), transparent 70%); animation: fadeOut .7s forwards;
  }
  @keyframes cardHit { 0% { transform: scale(1); } 30% { transform: scale(1.12); border-color: #fff3b0; } 100% { transform: scale(1); } }
  @keyframes fadeOut { to { opacity: 0; } }

  .coin {
    display: inline-block; width: .9em; height: .9em; border-radius: 50%; vertical-align: -.1em;
    background: radial-gradient(circle at 35% 30%, #fff3b0, #f6c544 45%, #b07a10);
    box-shadow: inset 0 0 0 1.5px #9a6a0a;
  }

  /* ---------- Leaderboard ---------- */
  #board {
    left: 22px; top: 498px; width: 384px; height: 322px; border-radius: 22px;
    background: var(--panel); border: 3px solid var(--gold-deep);
    box-shadow: inset 0 0 0 2px rgba(255,220,120,.15), 0 10px 24px rgba(0,0,0,.5);
    padding: 10px 12px;
  }
  #board h2 {
    font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 31px; letter-spacing: 1px;
    text-align: center; color: var(--gold); text-shadow: 0 3px 0 #5a0508; line-height: 1.1; margin-bottom: 6px;
  }
  #rows { position: relative; height: 252px; }
  .row {
    position: absolute; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 6px; border-radius: 14px; transition: top .6s cubic-bezier(.3,1.3,.5,1), background .4s;
    font-weight: 800; font-size: 23px;
  }
  .row .rk { width: 26px; text-align: center; color: var(--gold); font-size: 24px; }
  .row img, .row .ph { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; flex: none; background: #555; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; line-height: 1; }
  .row .nm small { display: block; font-size: 13px; color: var(--ink); letter-spacing: 1px; }
  .row .cs { color: var(--gold); display: flex; align-items: center; gap: 5px; }
  .row.first {
    height: 56px; background: linear-gradient(90deg, #f6c544, #ffe58a 50%, #d9a224);
    box-shadow: 0 0 22px rgba(255,200,60,.55);
  }
  .row.first .nm, .row.first .cs, .row.first .rk { color: var(--ink); }
  .row.first img { width: 44px; height: 44px; border-color: var(--red); }
  /* glow pulse via opacity only (cheap: no repaint every frame) */
  .row.first::after {
    content: ''; position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
    box-shadow: 0 0 34px rgba(255,220,90,.9); opacity: 0; will-change: opacity;
    animation: kumbariGlow 2s ease-in-out infinite;
  }
  @keyframes kumbariGlow { 50% { opacity: 1; } }
  .row.bump .cs { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.35); } }
  #board .empty { text-align: center; color: #d8b98f; font-size: 22px; padding-top: 70px; opacity: .8; }

  /* ---------- Feed (shares, joins...) ---------- */
  #feed { left: 424px; top: 500px; width: 540px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .feed-item {
    display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px 0 6px; border-radius: 30px;
    background: rgba(20, 3, 5, .82); border: 2px solid rgba(246,197,68,.7);
    font-size: 23px; font-weight: 700; color: #fff; white-space: nowrap; max-width: 540px;
    animation: feedIn .4s cubic-bezier(.2,1.5,.4,1); box-shadow: 0 6px 14px rgba(0,0,0,.4);
  }
  .feed-item img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
  .feed-item span { overflow: hidden; text-overflow: ellipsis; }
  .feed-item.out { animation: feedOut .4s forwards; }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-14px) scale(.8); } }
  @keyframes feedOut { to { opacity: 0; transform: translateY(-10px) scale(.9); } }

  /* ---------- Meters ---------- */
  .meter { width: 86px; display: flex; flex-direction: column; align-items: center; }
  .meter .mt { font-family: 'Lilita One', sans-serif; font-size: 27px; color: #fff; text-shadow: 0 3px 0 #5a0508, 0 0 10px rgba(0,0,0,.8); letter-spacing: 1px; }
  .meter .ic { font-size: 34px; line-height: 1; margin-bottom: 2px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.6)); }
  .tube {
    position: relative; width: 46px; border-radius: 26px; overflow: hidden;
    background: linear-gradient(90deg, rgba(0,0,0,.75), rgba(40,10,10,.65), rgba(0,0,0,.75));
    border: 3px solid var(--gold-deep); box-shadow: inset 0 0 10px #000, 0 6px 14px rgba(0,0,0,.6);
  }
  .tube .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; transition: height .8s cubic-bezier(.3,1.2,.5,1); }
  .tube .fill::after {
    content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 8px; border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.1));
  }
  .meter .pc { font-family: 'Lilita One', sans-serif; font-size: 30px; color: #fff; text-shadow: 0 3px 0 #000; margin-top: 4px; }
  .meter .st { font-size: 17px; font-weight: 800; color: var(--gold); text-align: center; line-height: 1; text-shadow: 0 2px 0 #000; width: 120px; }

  #qejf { right: 14px; top: 500px; }
  #qejf .tube { height: 270px; }
  #qejf .fill { background: linear-gradient(0deg, #ffb400, #ff6a00 55%, #ff2a2a); box-shadow: 0 0 20px #ff6a00; }
  #qejf.party .tube { animation: partyTube .4s infinite alternate; }
  @keyframes partyTube { to { border-color: #fff; box-shadow: 0 0 30px #ffcc00, inset 0 0 10px #000; } }

  /* KRUSHQIT likes meter (replaced the cake) */
  #krushqit { left: 10px; top: 830px; width: 104px; }
  #krushqit .kbanner {
    display: flex; flex-direction: column; align-items: center; padding: 6px 4px 5px; margin-bottom: 6px; width: 104px;
    background: linear-gradient(180deg, #e41e20, #9a0c12); border: 3px solid var(--gold); border-radius: 12px;
    box-shadow: 0 6px 14px rgba(0,0,0,.6); text-align: center; line-height: 1;
  }
  #krushqit .kbanner span { font-family: 'Lilita One', sans-serif; font-size: 21px; color: #fff; letter-spacing: .5px; text-shadow: 0 2px 0 #5a0508; }
  #krushqit .kbanner small { font-size: 15px; font-weight: 800; color: var(--gold); margin-top: 3px; }
  #krushqit .tube { height: 190px; }
  #krushqit .fill { background: linear-gradient(0deg, #b30d13, #e41e20 55%, #f6c544); box-shadow: 0 0 18px #ff4a3a; }
  #krushqit .lvl { font-size: 15px; font-weight: 800; color: #ffe3a0; text-shadow: 0 2px 0 #000; white-space: nowrap; }
  #krushqit.on .tube { animation: partyTube .4s infinite alternate; }
  #cake { display: none; }
  #cake .tube { height: 210px; }
  #cake .fill { background: linear-gradient(0deg, #ff5fa2, #ff9cc8 60%, #fff0f6); box-shadow: 0 0 18px #ff6fb0; }
  #cake .lvl { font-size: 15px; font-weight: 800; color: #ffd5ea; text-shadow: 0 2px 0 #000; }

  /* ---------- Now playing ---------- */
  #np {
    left: 0; right: 0; margin: 0 auto; width: fit-content; top: 1244px;
    display: none; align-items: center; gap: 12px; height: 52px; padding: 0 26px;
    border-radius: 30px; background: rgba(15, 2, 4, .85); border: 2px solid var(--gold-deep);
    font-size: 24px; font-weight: 800; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.6);
  }
  #np.on { display: flex; }
  #np .eq { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
  #np .eq i { width: 5px; height: 24px; background: var(--gold); border-radius: 2px; transform-origin: bottom; will-change: transform; animation: eq .6s ease-in-out infinite alternate; }
  #np .eq i:nth-child(2) { animation-delay: -.2s; } #np .eq i:nth-child(3) { animation-delay: -.4s; } #np .eq i:nth-child(4) { animation-delay: -.1s; }
  @keyframes eq { from { transform: scaleY(.17); } to { transform: scaleY(1); } }

  /* ---------- Big alert ---------- */
  #alert {
    position: absolute; z-index: 30; left: 0; top: 420px; width: 1080px; height: 640px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
  }
  #alert.show { animation: alertIn .55s cubic-bezier(.2,1.5,.4,1) forwards; }
  #alert.hide { animation: alertOut .45s forwards; }
  @keyframes alertIn { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes alertOut { from { opacity: 1; } to { opacity: 0; transform: scale(1.15); } }
  #alert .rays {
    position: absolute; width: 900px; height: 900px; left: 90px; top: -130px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,215,90,.38) 0 8deg, transparent 8deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 62%); mask: radial-gradient(circle, #000 18%, transparent 62%);
    animation: spin 10s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #alert .big-av {
    position: relative; width: 180px; height: 180px; border-radius: 50%; object-fit: cover; image-rendering: auto; filter: saturate(1.08) contrast(1.04);
    border: 10px solid var(--gold); box-shadow: 0 0 0 6px var(--red), 0 0 70px rgba(255,200,80,.9);
    background: #333; display: grid; place-items: center; font-size: 110px;
  }
  #alert .big-title {
    position: relative; margin-top: 18px; font-family: 'Lilita One', sans-serif; font-size: 96px; line-height: 1;
    color: #fff; letter-spacing: 2px; -webkit-text-stroke: 4px #8d0b12; paint-order: stroke fill;
    text-shadow: 0 7px 0 #5a0508, 0 0 40px rgba(255,170,60,.9);
  }
  #alert .big-name {
    position: relative; margin-top: 10px; padding: 6px 34px; border-radius: 40px;
    background: linear-gradient(180deg, #fffaf0, #f4e3bf); border: 4px solid var(--gold);
    color: var(--red); font-size: 46px; font-weight: 800; max-width: 900px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #alert .big-sub { position: relative; margin-top: 10px; font-size: 38px; font-weight: 800; color: var(--gold); text-shadow: 0 3px 0 #000; }

  /* ---------- Sound unlock (hidden inside OBS) ---------- */
  #sound {
    position: absolute; z-index: 50; right: 24px; bottom: 24px; padding: 16px 26px; border-radius: 40px;
    background: var(--gold); color: var(--ink); font-weight: 800; font-size: 28px; border: none; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.5); display: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="scene" width="1080" height="1920"></canvas>

  <div id="title" class="ui"><span class="glow"></span><span id="titleText">AHENGU SHQIPTARE</span></div>
  <div id="ticker" class="ui"><span class="av emoji">💍</span><span class="txt">Mirë se erdhe në dasmë!</span></div>
  <div id="legend" class="ui"></div>

  <div id="board" class="ui">
    <h2 id="boardTitle">BUJARËT E DASMËS</h2>
    <div id="rows"></div>
  </div>

  <div id="feed" class="ui"></div>

  <div id="qejf" class="ui meter">
    <div class="ic">🔥</div>
    <div class="mt" id="qejfTitle">QEJFI</div>
    <div class="tube"><div class="fill"></div></div>
    <div class="pc">0%</div>
    <div class="st">Dasma po fillon</div>
  </div>

  <div id="krushqit" class="ui meter">
    <div class="kbanner"><span id="kTitle">KRUSHQIT</span><small id="kGoal">50K LIKES</small></div>
    <div class="tube"><div class="fill"></div></div>
    <div class="pc">0%</div>
    <div class="lvl">0 / 50K</div>
  </div>

  <div id="np" class="ui"><div class="eq"><i></i><i></i><i></i><i></i></div><span id="npText"></span></div>

  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="alert"></div>
  <button id="sound">🔊 Kliko për zë</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/scene.js"></script>
<script src="/js/overlay.js"></script>
</body>
</html>
